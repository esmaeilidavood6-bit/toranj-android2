
name: Build Toranj APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract source
        run: |
          unzip -q ToranjAndroid_MVP.zip -d .
          test -f ToranjAndroid/app/build.gradle.kts

      - name: Build APK
        run: gradle -p ToranjAndroid :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toranj-APK
          path: ToranjAndroid/app/build/outputs/apk/debug/*.apk
